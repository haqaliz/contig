name: pages

# Deploy the marketing site in site/ to GitHub Pages. Only the page, its stylesheet
# and the assets it references are staged, so nothing else in the repo is published.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage site
        run: |
          mkdir -p _site/assets
          cp site/index.html site/styles.css _site/
          cp assets/contig-logo.svg assets/contig-selfheal.svg assets/contig-verify.svg assets/contig-demo.gif _site/assets/
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
